<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burrow - Underground Adventure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a0a00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            border: 2px solid #3a2010;
            border-radius: 4px;
            cursor: none;
            image-rendering: auto;
        }
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #start-screen, #death-screen {
            pointer-events: auto;
            text-align: center;
            color: #e8d4b0;
            background: rgba(20, 8, 0, 0.92);
            padding: 40px 60px;
            border-radius: 12px;
            border: 2px solid #5a3a1a;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        #start-screen h1, #death-screen h1 {
            font-size: 48px;
            margin-bottom: 8px;
            color: #c89050;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        #start-screen h2 {
            font-size: 18px;
            color: #9a7a50;
            margin-bottom: 24px;
            font-weight: normal;
            font-style: italic;
        }
        .controls-info {
            font-size: 14px;
            color: #8a7a60;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        .controls-info kbd {
            background: #2a1a08;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #5a3a1a;
            font-family: monospace;
            color: #c89050;
        }
        button {
            background: linear-gradient(180deg, #6a4a20, #4a3010);
            color: #e8d4b0;
            border: 2px solid #8a6a30;
            padding: 12px 36px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        button:hover {
            background: linear-gradient(180deg, #8a6a30, #6a4a20);
            border-color: #aa8a40;
            transform: scale(1.05);
        }
        #death-screen { display: none; }
        #death-screen .score { font-size: 24px; color: #c89050; margin: 12px 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
        <div id="start-screen">
            <h1>BURROW</h1>
            <h2>An Underground Adventure</h2>
            <div class="controls-info">
                <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> or Arrow Keys to move<br>
                <kbd>SPACE</kbd> to boost dig speed<br>
                Eat food to grow bigger and score points<br>
                Avoid dangers lurking in the earth!
            </div>
            <button id="startBtn">Start Burrowing</button>
        </div>
        <div id="death-screen">
            <h1>GAME OVER</h1>
            <div class="score" id="finalScore">Score: 0</div>
            <div class="score" id="finalSize">Size reached: 1x</div>
            <div style="margin: 12px 0; color: #8a7a60;" id="deathReason"></div>
            <button id="restartBtn">Try Again</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
